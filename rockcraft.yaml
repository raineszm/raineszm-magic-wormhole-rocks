name: magic-wormhole-mailbox-server-rock
base: bare
build-base: ubuntu@24.04
version: "0.5.1"
summary: Single-line elevator pitch for your amazing rock # 79 char long summary
description: |
  This is magic-wormhole-mailbox-server-rock's description. You have a paragraph or two to tell the
  most important story about it. Keep it under 100 words though,
  we live in tweetspace and your description wants to look good in the
  container registries out there.
platforms: # the platforms this rock should be built on and run on
  amd64:

run-user: _daemon_

parts:
  server:
    plugin: python
    stage-packages:
      - python3.12-venv_ensurepip
    python-packages:
      - magic-wormhole-mailbox-server==0.5.1
    source: https://github.com/magic-wormhole/magic-wormhole-mailbox-server.git
    source-tag: 0.5.1
    override-build: |
      craftctl default
      mkdir -p ${CRAFT_PART_INSTALL}/app
      chmod 1777 ${CRAFT_PART_INSTALL}/app
    override-prime: |
      craftctl default
      ln -s /usr/bin/python3.12 $CRAFT_PRIME/usr/bin/python3

services:
  twisted:
    override: replace
    command: twist wormhole-mailbox --usage-db=usage.sqlite
    startup: enabled
    working-dir: /app
    user: _daemon_
