name: magic-wormhole-mailbox-server-rock
title: Magic Wormhole Mailbox Server
base: bare
build-base: ubuntu@24.04
version: "0.5.1"
summary: Secure rendezvous mailbox service backing Magic Wormhole transfers
description: |
  Containerized Magic Wormhole mailbox server, built directly from
  https://github.com/magic-wormhole/magic-wormhole-mailbox-server. Provides
  the rendezvous point that enables end-to-end encrypted, PAKE-backed file
  and message handoffs via magic-wormhole clients in a minimal, rootless
  rock suitable for secure deployment.
source-code: https://github.com/magic-wormhole/magic-wormhole-mailbox-server
license: MIT
contact:
  - dev@zmraines.com
issues:
  - https://github.com/magic-wormhole/magic-wormhole-mailbox-server/issues
platforms: # the platforms this rock should be built on and run on
  amd64:

run-user: _daemon_

parts:
  server:
    plugin: python
    stage-packages:
      - python3.12-venv_ensurepip
    python-packages:
      - magic-wormhole-mailbox-server==0.5.1
    source: https://github.com/magic-wormhole/magic-wormhole-mailbox-server.git
    source-tag: 0.5.1
    override-build: |
      craftctl default
      mkdir -p ${CRAFT_PART_INSTALL}/app
      chmod 1777 ${CRAFT_PART_INSTALL}/app
    override-prime: |
      craftctl default
      ln -s /usr/bin/python3.12 $CRAFT_PRIME/usr/bin/python3

services:
  twisted:
    override: replace
    command: twist wormhole-mailbox --usage-db=usage.sqlite
    startup: enabled
    working-dir: /app
    user: _daemon_
